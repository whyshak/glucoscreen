<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle for contrast in both dark & light browser tabs -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <!-- Droplet body -->
  <path d="M16 5.5 C16 5.5 9 13.5 9 18.5 A7 7 0 0 0 23 18.5 C23 13.5 16 5.5 16 5.5 Z" fill="url(#dropGrad)"/>
  <!-- ECG Glucose wave line inside droplet -->
  <path d="M11.5 19.5 H13.8 L15 16.5 L17 22 L18.2 19.5 H20.5" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
